<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão Operacional | Grupo Gavinho</title><style> *{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#18324e;font:14px system-ui}header{background:#12365c;color:white;padding:25px}main{max-width:1450px;margin:auto;padding:20px}h1{margin:5px 0}section,.month{background:white;border:1px solid #dce4ed;border-radius:10px;padding:16px;margin-bottom:15px}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:6px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#164d80;color:white}label{display:grid;gap:5px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.day{min-height:38px;padding:4px;background:#f1f5f9;border:0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:1px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.event{border-bottom:1px solid #ddd;padding:12px 0}.muted{color:#64748b}#msg{white-space:pre-wrap;color:#a33} [hidden]{display:none!important}.credit{font-size:12px;color:#dbeafe;margin-top:8px;font-style:italic}.day:hover,.day:focus-visible{outline:2px solid #2563eb;outline-offset:1px}.tip{position:fixed;z-index:9999;pointer-events:none;background:#12365c;color:white;padding:12px;border-radius:8px;box-shadow:0 5px 20px #0003;max-width:min(340px,calc(100vw - 24px));white-space:pre-line;line-height:1.5;font-size:13px}</style><header><small>GRUPO GAVINHO • SEMIPRESENCIAL</small><h1>Gestão Operacional | Calendário 2027</h1><div>Planejamento anual de práticas e estágios</div><div class="credit">desenvolvido por Jonas Lobo</div></header><main><section id="login" hidden><h2>Acesso autorizado</h2><form id="loginform" class="row"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Senha" required><button class="primary">Entrar</button><button type="button" id="cancelLogin">Cancelar</button></form></section><p id="msg" role="alert"></p><div id="app"><section class="row"><strong id="role"></strong><button id="reload">Atualizar</button><button id="openLogin" class="primary">Área administrativa</button><button id="logout" hidden>Sair</button></section><section><div class="fields"><label>Módulo<select id="filtermod"><option value="">Todos</option><option>51/2027</option><option>52/2027</option><option>53/2027</option><option>54/2027</option></select></label><label>Região<select id="filterreg"><option value="">Todas</option><option>RJ</option><option>SP</option></select></label><label>Curso ou polo<input id="search"></label></div><h3 id="stats"></h3><div id="legend" class="row"></div></section><div class="months" id="months"></div><section id="dayinfo">Selecione um dia para consultar atividades.</section><section id="editor" hidden><h2 id="formtitle">Nova atividade</h2><form id="eventform"><div class="fields"><label>Categoria<select id="categoria"></select></label><label>Título personalizado<input id="titulo" placeholder="Opcional"></label><label>Módulo<select id="modulo"><option>51/2027</option><option>52/2027</option><option>53/2027</option><option>54/2027</option></select></label><label>Região<select id="regiao"><option>RJ</option><option>SP</option><option>RJ e SP</option></select></label><label>Curso<input id="curso"></label><label>Polo<input id="polo"></label><label>Início<input id="data_inicio" type="date" min="2027-01-01" max="2027-12-31" required></label><label>Término<input id="data_fim" type="date" min="2027-01-01" max="2027-12-31" required></label><label>Responsável<input id="responsavel"></label><label>Status<select id="status"><option>Planejado</option><option>Em andamento</option><option>Concluído</option><option>Em atraso</option></select></label><label>Observações<textarea id="observacoes"></textarea></label></div><p class="row"><button class="primary">Salvar atividade</button><button type="button" id="clear">Limpar</button></p></form></section><section><h2>Plano de ação</h2><div id="list"></div></section></div></main><div id="daytip" class="tip" role="tooltip" hidden></div><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://dgyvuatwoktyuitcnrkp.supabase.co','sb_publishable_gKxjPpx40p7VdVSKm2J2jA_QQiMeNgr');const $=id=>document.getElementById(id);const cats=['Identificação de alunos','Alocação de alunos','Reunião com alunos','Contratação de preceptor','Envio de TCE','Envio de ficha de frequência','Início de estágio','Outra atividade'];const colors=['#2563eb','#0d9488','#9333ea','#ea580c','#ca8a04','#db2777','#16a34a','#64748b'];const fields=['categoria','titulo','modulo','regiao','curso','polo','data_inicio','data_fim','responsavel','status','observacoes'];let events=[],admin=false,editing=null,selected='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const color=e=>colors[cats.indexOf(e.categoria)]||colors[7];const fmt=d=>d.split('-').reverse().join('/');const msg=t=>$('msg').textContent=t||''; $('categoria').innerHTML=cats.map(x=>`<option>${x}</option>`).join('');$('legend').innerHTML=cats.map((x,i)=>`<span><i class="dot" style="background:${colors[i]}"></i>${x}</span>`).join('');
async function load(){let {data,error}=await db.from(admin?'atividades':'calendario_publico').select('*').lte('data_inicio','2027-12-31').gte('data_fim','2027-01-01').order('data_inicio');if(error){msg(error.message);return}events=data;render()}
async function session(s){events=[];admin=false;editing=null;$('editor').hidden=true;$('login').hidden=true;$('app').hidden=false;$('openLogin').hidden=!!s;$('logout').hidden=!s;$('role').textContent=s?'Consulta':'Visualização pública';clear();render();if(s){let {data,error}=await db.from('administradores').select('usuario_id').eq('usuario_id',s.user.id).maybeSingle();admin=!!data&&!error;$('role').textContent=admin?'Administrador':'Consulta';$('editor').hidden=!admin;if(error)msg(error.message)}await load()}
$('openLogin').onclick=()=>{$('login').hidden=false;$('email').focus()};$('cancelLogin').onclick=()=>{$('login').hidden=true;$('password').value='';msg('')};
$('loginform').onsubmit=async e=>{e.preventDefault();msg('');let {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)msg(error.message);else await session(data.session)};$('logout').onclick=async()=>{let {error}=await db.auth.signOut();if(error)msg(error.message);else await session(null)};$('reload').onclick=load;
function filtered(){let q=$('search').value.toLowerCase();return events.filter(e=>(!$('filtermod').value||e.modulo===$('filtermod').value)&&(!$('filterreg').value||e.regiao===$('filterreg').value||e.regiao==='RJ e SP')&&(!q||`${e.curso||''} ${e.polo||''}`.toLowerCase().includes(q)))}
function render(){$("daytip").hidden=true;let es=filtered();$('stats').textContent=`${es.length} atividades • ${es.filter(e=>e.status==='Concluído').length} concluídas • ${es.filter(e=>e.status==='Em andamento').length} em andamento`;$('months').innerHTML=Array.from({length:12},(_,m)=>{let h=`<div class="month"><h3>${new Date(2027,m,1).toLocaleDateString('pt-BR',{month:'long'})}</h3><div class="days">${['D','S','T','Q','Q','S','S'].map(x=>`<small>${x}</small>`).join('')}`;h+='<span></span>'.repeat(new Date(2027,m,1).getDay());for(let d=1;d<=new Date(2027,m+1,0).getDate();d++){let date=`2027-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,a=es.filter(e=>e.data_inicio<=date&&e.data_fim>=date);h+=`<button class="day" data-date="${date}" aria-label="${esc(fmt(date)+': '+(a.map(e=>e.titulo).join('; ')||'Nenhuma atividade programada'))}" style="${a.length?'background:'+color(a[0])+'22':''}">${d}<div>${[...new Set(a.map(color))].map(c=>`<i class="dot" style="background:${c}"></i>`).join('')}</div></button>`}return h+'</div></div>'}).join('');$('list').innerHTML=es.map(e=>`<div class="event"><strong><i class="dot" style="background:${color(e)}"></i>${esc(e.titulo)}</strong><p>${fmt(e.data_inicio)} a ${fmt(e.data_fim)} • ${esc(e.modulo)} • ${esc(e.regiao)} • ${esc(e.status)}</p><p class="muted">${esc(e.curso)} ${esc(e.polo)} ${admin?esc(e.responsavel)+' '+esc(e.observacoes):''}</p>${admin?`<button data-edit="${esc(e.id)}">Editar</button> <button data-del="${esc(e.id)}">Excluir</button>`:''}</div>`).join('')||'Nenhuma atividade cadastrada.';if(selected)$('dayinfo').innerHTML='<strong>'+fmt(selected)+'</strong><p>'+ (es.filter(e=>e.data_inicio<=selected&&e.data_fim>=selected).map(e=>esc(e.titulo)).join(' • ')||'Nenhuma atividade')+'</p>'}
const tip=$('daytip');function showTip(b){if(!b)return;let date=b.dataset.date,a=filtered().filter(e=>e.data_inicio<=date&&e.data_fim>=date);tip.textContent=fmt(date)+'\n'+(a.length?a.map(e=>'• '+e.titulo+(e.modulo?' | '+e.modulo:'')+(e.curso?' | '+e.curso:'')+'\n  '+fmt(e.data_inicio)+' a '+fmt(e.data_fim)).join('\n'):'Nenhuma atividade programada');tip.hidden=false;let r=b.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';tip.style.top=Math.max(8,r.bottom+h+8<=innerHeight?r.bottom+6:r.top-h-6)+'px'}function hideTip(){tip.hidden=true} $('months').addEventListener('pointerover',e=>{let b=e.target.closest('[data-date]');if(b&&e.pointerType!=='touch')showTip(b)});$('months').addEventListener('pointerout',e=>{let b=e.target.closest('[data-date]');if(b&&!b.contains(e.relatedTarget))hideTip()});$('months').addEventListener('focusin',e=>showTip(e.target.closest('[data-date]')));$('months').addEventListener('focusout',hideTip);window.addEventListener('scroll',hideTip,true);window.addEventListener('resize',hideTip);document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});$('months').onclick=e=>{let d=e.target.closest('[data-date]')?.dataset.date;if(!d)return;selected=d;if(admin&&!editing){$('data_inicio').value=d;$('data_fim').value=d}render();showTip($('months').querySelector('[data-date="'+d+'"]'))};['filtermod','filterreg','search'].forEach(k=>$(k).oninput=render);function clear(){editing=null;$('eventform').reset();$('formtitle').textContent='Nova atividade'}$('clear').onclick=clear;$('eventform').onsubmit=async e=>{e.preventDefault();if(!admin)return;let o=Object.fromEntries(fields.map(k=>[k,$(k).value]));if(o.data_fim<o.data_inicio){msg('O término deve ser igual ou posterior ao início.');return}o.titulo=o.titulo.trim()||o.categoria;o.cor=color(o);let {error}=editing?await db.from('atividades').update(o).eq('id',editing):await db.from('atividades').insert(o);if(error)msg(error.message);else{msg('');clear();await load()}};$('list').onclick=async e=>{if(!admin)return;let id=e.target.dataset.edit,del=e.target.dataset.del;if(id){let a=events.find(x=>x.id===id);editing=id;fields.forEach(k=>$(k).value=a[k]||'');$('formtitle').textContent='Editar atividade';$('editor').scrollIntoView({behavior:'smooth'})}if(del&&confirm('Excluir esta atividade?')){let {error}=await db.from('atividades').delete().eq('id',del);if(error)msg(error.message);else await load()}};let {data,error}=await db.auth.getSession();if(error)msg(error.message);await session(data.session);
</script></html>
